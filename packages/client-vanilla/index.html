<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ClipBeam 剪贴板桥接</title>
    <style>
      :root {
        --bg: #0f1320;
        --card: #1a2030;
        --fg: #e8ecf4;
        --mut: #93a0b8;
        --ok: #3ddc84;
        --err: #ff6b6b;
        --warn: #ffb454;
        --acc: #5b8cff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.6 -apple-system,
          'Segoe UI',
          Roboto,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      h1 {
        font-size: 20px;
        margin: 4px 0 2px;
      }

      .sub {
        color: var(--mut);
        font-size: 12px;
        margin-bottom: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid #263047;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }

      .card h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }

      .hint {
        color: var(--mut);
        font-size: 12px;
        margin-bottom: 12px;
      }

      button {
        background: var(--acc);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
      }

      button.sec {
        background: #2b3550;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      label {
        font-size: 12px;
        color: var(--mut);
      }

      .status {
        margin: 10px 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #11172a;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 20px;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.err {
        color: var(--err);
      }

      .status.warn {
        color: var(--warn);
      }

      .status.run {
        color: var(--acc);
      }

      .bar {
        height: 6px;
        background: #11172a;
        border-radius: 3px;
        overflow: hidden;
        margin: 8px 0;
        display: none;
      }

      .bar i {
        display: block;
        height: 100%;
        background: var(--acc);
        width: 50%;
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      /* 宿主机键盘注入时的实时打字回显：固定网格、字符原位循环覆盖 */
      .typed {
        display: none;
        margin-top: 8px;
        padding: 8px 10px;
        background: #0c1120;
        border: 1px solid #2b3550;
        border-radius: 8px;
        font:
          12px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        color: var(--acc);
        overflow: hidden;
      }

      .typed.show {
        display: block;
      }

      .typed-grid {
        display: grid;
        grid-template-columns: repeat(30, 1ch);
        font-size: 3em;
      }

      .typed-grid .cell {
        width: 1ch;
        height: 1.5em;
        line-height: 1.5em;
        white-space: pre;
      }

      /* 最新落子格：原位覆盖并短暂高亮（pop 动画每次落字重放） */
      .typed-grid .cell.fresh {
        color: #7fd1ff;
        animation: live-pop 0.32s ease-out;
      }

      .typed-line2 {
        color: #6b7591;
      }

      @keyframes live-pop {
        0% {
          color: #d6f1ff;
          transform: translateY(-2px);
          text-shadow: 0 0 9px rgba(127, 209, 255, 0.95);
        }
        100% {
          color: #7fd1ff;
          transform: none;
          text-shadow: none;
        }
      }

      .typed .cursor {
        margin-left: 1px;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }

        51%,
        100% {
          opacity: 0;
        }
      }

      textarea {
        width: 100%;
        min-height: 84px;
        background: #0c1120;
        color: var(--fg);
        border: 1px solid #2b3550;
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
        resize: vertical;
      }

      .qr {
        display: none;
      }

      /* 播放时：固定全屏遮罩，二维码始终居中（滚动/缩放都不影响截屏区域） */
      .qr.show {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(8, 11, 22, 0.82);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        cursor: pointer;
      }

      .qr .qr-card {
        display: block;
        background: #fff;
        padding: 16px;
        border-radius: 14px;

        width: min(78vmin, 820px);
        height: min(78vmin, 820px);
      }

      .qr-card > * {
        display: block;
        width: 100%;
        height: 100%;
      }

      .qr .qr-tip {
        color: #cdd6ea;
        font-size: 15px;
        letter-spacing: 0.5px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .adv {
        display: none;
        margin-top: 10px;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--mut);
      }

      .adv input {
        width: 80px;
        background: #0c1120;
        color: var(--fg);
        border: 1px solid #2b3550;
        border-radius: 6px;
        padding: 4px 6px;
      }

      .badge {
        font-size: 11px;
        color: var(--warn);
        border: 1px solid var(--warn);
        border-radius: 6px;
        padding: 1px 6px;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>ClipBeam 剪贴板桥接</h1>
      <div class="sub">
        宿主机 ↔ 远程浏览器 · 无网络通道 · 键盘 /
        二维码。接收前请<b>点击本页空白处</b>让焦点落在页面上；键盘通道要求远程会话为
        <span class="badge">US/QWERTY 布局</span>
      </div>

      <div class="card">
        <h2>① 接收入站（宿主机 → 远程）</h2>
        <div class="hint">在宿主机按发送热键后，这里会自动接收、CRC 校验并写入远程剪贴板。</div>
        <label><input type="checkbox" id="pauseChk" /> 暂停接收（在页面输入框内打字时建议勾选）</label>
        <div class="bar" id="inBar"><i></i></div>
        <div class="status" id="inStatus">等待接收…</div>
        <div class="typed" id="typed" aria-label="键盘输入实时回显">
          <div class="typed-grid" id="typedGrid"></div>
          <div class="typed-line2"><span id="typedSuffix"></span><span class="cursor" aria-hidden="true">▋</span></div>
        </div>
        <textarea id="manualCopy" style="display: none"></textarea>
        <div class="row" id="manualRow" style="display: none">
          <button class="sec" id="copyBtn">复制上述文本</button>
        </div>
      </div>

      <div class="card">
        <h2>② 发送出站（远程 → 宿主机）</h2>
        <div class="hint">读取远程剪贴板 → 编码为二维码循环播放；在宿主机按接收热键截屏收包。</div>
        <div class="row">
          <button id="readBtn">读取远程剪贴板并生成二维码</button>
          <button class="sec" id="stopBtn" disabled>■ 停止播放</button>
        </div>
        <textarea
          id="pasteBox"
          style="display: none; margin-top: 10px"
          placeholder="若读取被浏览器拒绝，把远程剪贴板内容粘贴到这里，再点下方按钮"
        ></textarea>
        <div class="row" id="pasteRow" style="display: none">
          <button id="pasteStartBtn">用上方文本生成二维码</button>
        </div>
        <label class="row" style="margin-top: 6px"
          ><input type="checkbox" id="advChk" /> 高级：调整帧长 / 播放间隔</label
        >
        <div class="adv" id="advBox">
          每帧字符数 <input id="chunkIn" type="number" value="800" min="200" max="1500" step="50" /> 每帧停留(ms)
          <input id="intervalIn" type="number" value="300" min="100" max="3000" step="50" />
        </div>
        <div class="status" id="outStatus">未生成</div>
        <div class="qr" id="qrBox">
          <div class="qr-card" id="qrc"></div>
          <div class="qr-tip" id="qrTip">点击任意处关闭</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
