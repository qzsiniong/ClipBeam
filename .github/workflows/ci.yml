name: CI

# 提交/PR 跑测试；release.yml 在打包前用 workflow_call 复用同一套。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # src-tauri/build.rs 用 include_str! 内嵌 packages/client-vanilla/dist/index.html，
  # 产物缺失/过期时它会自己调 pnpm。这里先显式构建一次，再用该变量让它跳过自动构建。
  CLIPBEAM_SKIP_WEB_BUILD: '1'

jobs:
  frontend:
    name: 前端（lint / 类型 / 单测 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: 脚本 .d.ts 类型检查
        run: pnpm typecheck:scripts

      - name: 编辑器单测（vitest）
        run: pnpm test:editor

      - name: 前端构建（vue-tsc + vite）
        run: pnpm build

  rust:
    name: Rust（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建远程接收页（build.rs 的 include_str! 输入）
        run: pnpm build:web

      - name: 格式检查（rustfmt，与平台无关，只跑一次）
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # 三个平台都跑：macOS / Windows 专属的 cfg 分支只有在本平台才会被编译到
      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试（脚本引擎 / 能力集 / Tauri）
        run: cargo test --workspace
