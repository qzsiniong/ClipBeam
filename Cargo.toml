[package]
name = "keybeam"
version = "0.1.0"
edition = "2021"
description = "KeyBeam Clipboard - host/remote clipboard bridge over keyboard and QR channels"

[dependencies]
enigo = "0.6"
arboard = "3"
global-hotkey = "0.8"
tray-icon = "0.24"
winit = "0.30"
egui = "0.29"
egui-winit = "0.29"
egui_glow = { version = "0.29", features = ["winit"] }
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
xcap = { version = "0.9", features = ["image"], default-features = false }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# 示例/E2E：解码 qrcode-generator 产出的 GIF 帧
image = { version = "0.25", features = ["gif", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"

[build-dependencies]
png = "0.18"

[profile.release]
opt-level = 2
strip = true
