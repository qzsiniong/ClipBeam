[package]
name = "clipbeam-scripting"
version = "0.1.0"
edition = "2021"
description = "ClipBeam 的脚本能力集：把 MD5 / Base32 / Zstd / 键盘输出 / 确认以扩展形式注入 clipbeam-script"
license = "MIT"

[dependencies]
clipbeam-script = { path = "../clipbeam-script" }
# 写扩展本体需要 rquickjs 的类型；features 必须与 clipbeam-script 保持一致
rquickjs = { version = "0.14", features = ["futures", "array-buffer"] }
tokio = { version = "1", features = ["rt", "time", "macros", "rt-multi-thread"] }
anyhow = "1"
# 摘要（crate 名 md-5，库名 md5）
md-5 = "0.11"
# 十六进制编码
hex = "0.4"
# 纯 Rust Zstandard 实现
zstandard = "0.1"
# RFC4648 无填充 base32（与 src-tauri 的 protocol 同源，行为一致）
data-encoding = "2"
# 脚本目录 config_dir/ClipBeam/scripts
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
