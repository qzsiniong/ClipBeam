[package]
name = "clipbeam"
version = "0.1.0"
edition = "2021"
description = "ClipBeam - host/remote clipboard bridge over keyboard and QR channels"

[lib]
name = "clipbeam_lib"
path = "src/lib.rs"

[[bin]]
name = "clipbeam"
path = "src/main.rs"

[[example]]
name = "qr_e2e"
path = "../examples/qr_e2e.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
enigo = "0.6"
arboard = "3"
xcap = { version = "0.9", features = ["image"], default-features = false }
zstd = "0.13"
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"

[dev-dependencies]
image = { version = "0.25", features = ["gif", "png"] }

[build-dependencies]
png = "0.18"
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 2
strip = true
